[package]
name = "daggerfall-dungeon-maker"
version = "0.2.0"
edition = "2021"
description = "A CAD-style 3D viewer and editor for The Elder Scrolls II: Daggerfall dungeons and dungeon blocks."
license = "MIT"

[[bin]]
name = "daggerfall-dungeon-maker"
path = "src/main.rs"

[dependencies]
# Window, immediate-mode UI and the wgpu integration used for the 3D viewport.
# "x11" and "wayland" select the Linux window systems; they have no effect on Windows.
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "persistence",
    "x11",
    "wayland",
] }
# Saving the user's own room and model names with the app's settings.
serde = { version = "1", features = ["derive"] }
# Reading and writing project (.ddm) files.
serde_json = "1"
# Plain-old-data casting for GPU vertex and uniform buffers.
bytemuck = { version = "1.16", features = ["derive"] }
# Vector and matrix math.
glam = "0.29"
# Native file and folder dialogs.
rfd = "0.15"
# Reading the PNG and JPG images used as dungeon skyboxes.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Logging facade and a simple console logger for debug builds.
log = "0.4"
env_logger = "0.11"

# Previewing Daggerfall's music through the system's MIDI synthesizer. (On
# Linux the song is handed to TiMidity or FluidSynth instead, so no ALSA
# development files are needed to build.)
[target.'cfg(not(target_os = "linux"))'.dependencies]
midir = "0.10"

[profile.release]
opt-level = 3
lto = "thin"

# Keep parsing fast while iterating in debug builds; the data files are large.
[profile.dev.package."*"]
opt-level = 2

# Checking the WGSL shaders in tests, as wgpu checks them when the program starts.
[dev-dependencies]
naga = { version = "22.1", features = ["wgsl-in"] }
